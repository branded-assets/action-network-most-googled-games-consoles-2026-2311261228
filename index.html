  }

header.top::before,.foot::before{content:"";position:absolute;top:0;right:0;bottom:0;width:40%;background-image:var(--icons);background-size:480px 520px;background-position:right top;pointer-events:none;

/* map screen */

.map svg{display:block;width:100%;height:auto;cursor:grab}
.map svg:active{cursor:grabbing}
.map path{stroke:#0b1a30;stroke-width:.6px;vector-effect:non-scaling-stroke;transition:opacity .15s;cursor:pointer}
.map path:hover{stroke:#fff;stroke-width:1.4px}

.sw{display:inline-block;width:14px;height:14px}

/* leaderboard */

.lb li{margin:0 0 4px}

.xp{grid-column:3 / 5;height:10px;margin-top:-2px;background:repeating-linear-gradient(90deg,#dfe7f0 0 8px,transparent 8px 11px)}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 11px)}
.vol{list-style:none;margin:0;padding:0}
.vol li{display:grid;grid-template-columns:30px minmax(0,34%) minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:15px}
.vol .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol .trk{display:flex;align-items:center;gap:10px;min-width:0}
.vol .xp{grid-column:auto;margin:0;flex:1 1 auto;min-width:20px}
.vol .val{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:26px}
.stat{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px 16px}
.stat .big{font-family:var(--pix);font-weight:700;font-size:30px;line-height:1.1}

.spot{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:34px}

.spot p{margin:0 0 8px;max-width:40em}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}

table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid #e3e9f0;white-space:nowrap}
th{white-space:normal;vertical-align:bottom;line-height:1.25}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{background:var(--ink);color:#fff;position:sticky;top:0;z-index:1}
th button{all:unset;cursor:pointer;font:700 13px var(--pix);display:inline-block;text-align:inherit}
th button:hover{color:var(--lime)}
th button:focus-visible{outline:3px solid #ffd54a}
tbody tr:nth-child(even){background:#f6f9fc}

/* methodology */
.method{margin-top:40px;color:var(--muted);font-size:15px;max-width:66em}
.method h3{font-family:var(--pix);color:var(--ink);font-size:22px;margin:0 0 10px}
.method ul{margin:0 0 14px;padding-left:22px}
.method li{margin-bottom:5px}
details[open] 
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13.5px;padding:8px 11px;border:2px solid var(--lime);z-index:20;opacity:0;max-width:250px;line-height:1.35}

@media (max-width:920px){.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.sprites{display:none}.spot{grid-template-columns:1fr}.lb{max-height:none}}
@media (max-width:600px){.wrap{padding:0 14px}.vol li{grid-template-columns:30px minmax(0,40%) minmax(0,1fr)}.card{padding:14px;box-shadow:4px 4px 0 var(--ink)}}

.foot{position:relative;overflow:hidden;background:var(--ink);border-top:4px solid var(--lime);color:#c3d1e2;padding:28px 0}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:26px}

.pod.p1{border-top:10px solid var(--gold)}.pod.p2{border-top:10px solid var(--silver)}.pod.p3{border-top:10px solid var(--bronze)}
.pod-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pod-name{font-weight:800;font-size:22px;line-height:1.15}
.pod-num{font-weight:800;font-size:40px;line-height:1.05;color:var(--green-dark);letter-spacing:-.02em}

@media (max-width:920px){.podium{grid-template-columns:1fr}header.top::before{display:none}}

@media (max-width:700px){.tabs{flex-wrap:wrap;overflow:visible}}

/* rank 1 shine */
.map path.top1{stroke:#fff;stroke-width:2px;filter:drop-shadow(0 0 4px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(120,255,190,.75));animation:shine 2.4s ease-in-out infinite alternate}

.map .ring{fill:none;stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.sw-top{background:#a2f5c8;border:2px solid #fff;box-shadow:0 0 6px #fff;width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.map path.top1,.map .ring{animation:none}.map .ring{opacity:.8}}
.bystate{margin:0;max-height:420px;overflow:auto}
.bystate dt{font-weight:600;margin-top:12px;display:flex;gap:8px;align-items:center}
.bystate dt:first-child{margin-top:0}
.bystate dt small{font:400 13px var(--body);color:var(--muted)}
.bystate dd{margin:3px 0 0 22px;color:var(--muted);font-size:14.5px}

.vtbl th{font:700 13px var(--pix);vertical-align:middle}
.vtbl th:last-child,.vtbl td:last-child{text-align:right;font-weight:600}
.vtbl th:first-child,.vtbl td:first-child{width:64px}
.vtbl td{padding:9px 10px}

/* header */
header.top.game-head{padding-bottom:30px}
header.top.game-head h1{max-width:19em}
.hdr-seg{margin-top:22px;box-shadow:4px 4px 0 var(--lime);border-color:#fff}

/* additions */
.segs{display:flex;flex-wrap:wrap;gap:14px 22px}
.notice{margin-bottom:26px}
.stats{margin-top:0}
.seg.sm{box-shadow:3px 3px 0 var(--ink)}

.podium+.sechead,.stats+.podium{margin-top:0}
.podium+.sechead{margin-top:34px}
th.tl,td.tl{text-align:left}

.scale button.lg{font:inherit;color:#c3d1e2;background:transparent;border:2px solid transparent;padding:2px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

@media (max-width:900px){.hide-sm{display:none}}
@media (max-width:600px){th,td{padding:7px 6px;font-size:13px}.toolbar input{min-width:0;width:100%}}

const CCAT = {'PlayStation 5':'#4aa3ff','Nintendo Switch':'#ff5a5f','Nintendo Switch 2':'#f5c542','PlayStation 4':'#00c2c7','Xbox Series X':'#2fd079','Xbox 360':'#a2d94a','Gaming PC':'#b08cff'};
const fmt = d3.format(',');
const tip = document.getElementById('tip');
const state = {mode:'world', cat:'games', tbl:'', sort:{key:'rank', dir:1}, q:'', focus:null};
const FIELD = {games:'game', consoles:'console'}, COLORS = {games:CAT, consoles:CCAT}, NOUN = {games:'game', consoles:'console'};
let geo = null, curPaths = null, curRow = null;

const geoPromise = Promise.all([d3.json(WORLD_URL), d3.json(US_URL)]).then(([w, u]) => {
  geo = {
    world: topojson.feature(w, w.objects.countries).features.filter(f => String(f.id).padStart(3, '0') !== '010'),
    us: topojson.feature(u, u.objects.states).features
  };

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const popf = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : fmt(n);
const id3 = f => String(f.id).padStart(3, '0');
const id2 = f => String(f.id).padStart(2, '0');
const sw = c => `<i class="sw" style="background:${c}"></i>`;
function showTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 262) + 'px';
  tip.style.top = (ev.clientY + 16) + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };
function setHash(){ try { history.replaceState(null, '', '#' + state.mode); } catch (e) { /* sandboxed frames block this */ } }

/* ---------- map ---------- */
function applyFocus(){
  if (!curPaths) return;
  const f = FIELD[state.cat]; curPaths.classed('dim', d => { if (!state.focus) return false; const r = curRow(d); return !r || r[f] !== state.focus; });
}
async function drawMap(cfg){
  const el = document.getElementById('map'), hud = document.getElementById('hud');
  await geoPromise;
  if (!document.getElementById('map')) return;
  if (!geo){ el.innerHTML = '<div class="maperr">The map shapes could not be loaded. Check your connection and reload the page.</div>'; return; }
  const feats = cfg.kind === 'world' ? geo.world : geo.us;
  const W = 1000, H = cfg.kind === 'world' ? 520 : 590;
  const proj = cfg.kind === 'world' ? d3.geoNaturalEarth1() : d3.geoAlbersUsa();
  proj.fitExtent([[6, 6], [W - 6, H - 6]], {type:'FeatureCollection', features:feats});
  const path = d3.geoPath(proj);
  const svg = d3.select(el).html('').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
    .attr('aria-label', cfg.kind === 'world' ? 'Interactive world map' : 'Interactive map of US states');
  const g = svg.append('g');
  const paths = g.selectAll('path').data(feats).join('path').attr('d', path)
    .attr('fill', d => cfg.fill(d) || NODATA)
    .on('pointerenter', (ev, d) => { hud.innerHTML = cfg.info(d); })
    .on('pointermove', (ev, d) => { const h = cfg.tip(d); if (h) showTip(ev, h); else hideTip(); })
    .on('pointerleave', hideTip)
    .on('click', function (ev, d) {
      paths.classed('sel', false); d3.select(this).classed('sel', true).raise();
      hud.innerHTML = cfg.info(d);
    });
  curPaths = paths; curRow = cfg.row; applyFocus();
  let ring = null;
  if (cfg.topId){
    const tp = paths.filter(d => cfg.id(d) === cfg.topId);
    if (!tp.empty()) {
      tp.classed('top1', true).raise();
      const c = path.centroid(tp.datum());
      if (isFinite(c[0]) && isFinite(c[1])) ring = g.append('circle').attr('class', 'ring').attr('cx', c[0]).attr('cy', c[1]).attr('r', 8);
    }
  }
  const zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0, 0], [W, H]]).extent([[0, 0], [W, H]])
    .filter(ev => ev.type === 'wheel' ? ev.ctrlKey : !ev.button)
    .on('zoom', ev => { g.attr('transform', ev.transform); if (ring) ring.attr('r', 8 / ev.transform.k); });
  svg.call(zoom).style('touch-action', 'pan-y');
  document.querySelectorAll('.zoom button').forEach(b => b.onclick = () => {
    const a = b.dataset.z;

}

function quantLegend(sc, vals, noDataLabel){
  const cuts = [d3.min(vals), ...sc.quantiles(), d3.max(vals)];
  return SCALE.map((g, i) => `<span>${sw(g)}${fmt(Math.round(cuts[i]))} to ${fmt(Math.round(cuts[i + 1]))}</span>`).join('') +
    `<span><i class="sw sw-top"></i>Ranked first</span><span>${sw(NODATA)}${noDataLabel}</span>`;
}

}

function catMapCfg(kind){

  const order = Object.keys(colors).filter(g => counts.get(g)).sort((a, b) => counts.get(b) - counts.get(a));
  const legend = order.map(g => `<button type="button" class="lg" data-g="${esc(g)}" aria-pressed="${state.focus === g}">${sw(colors[g])}${esc(g)} (${counts.get(g)})</button>`).join('') + `<span>${sw(NODATA)}No data</span>`;
  const vol = r => state.cat === 'games' ? `<span><b>${fmt(r.v)}</b> average monthly searches</span>` : '';
  const info = f => {
    const r = row(f), nm = esc((f.properties || {}).name || '');
    if (!r) return `<div><div class="hud-name">${nm}</div><div class="hud-line">No data.</div></div>`;
    return `${sw(colors[r[field]])}<div><div class="hud-name">${esc(r.name)}</div><div class="hud-stats"><span>Most Googled ${noun}: <b>${esc(r[field])}</b></span>${vol(r)}</div></div>`;
  };
  const tp = f => { const r = row(f); return r ? `<b>${esc(r.name)}</b><br>Most Googled ${noun}: ${esc(r[field])}` + (state.cat === 'games' ? `<br>${fmt(r.v)} average monthly searches` : '') : `<b>${esc((f.properties || {}).name || '')}</b><br>No data`; };
  return {kind: world ? 'world' : 'us', topId:null, id:key, row, fill: f => { const r = row(f); return r ? colors[r[field]] : null; }, info, tip: tp, legend};
}
function usaVolumeCfg(){
  const rows = D.states, idx = {}; rows.forEach(r => idx[r.fips] = r);
  const row = f => idx[id2(f)];
  const sc = d3.scaleQuantile().domain(rows.map(r => r.v)).range(SCALE);
  const top = rows.slice().sort((a, b) => b.v - a.v)[0];
  const info = f => {
    const r = row(f);
    if (!r) return `<div><div class="hud-name">${esc((f.properties || {}).name || '')}</div><div class="hud-line">No data.</div></div>`;
    return `${sw(sc(r.v))}<div><div class="hud-name">${esc(r.name)}</div><div class="hud-stats"><span>Most Googled game: <b>${esc(r.game)}</b></span><span><b>${fmt(r.v)}</b> average monthly searches</span></div></div>`;
  };
  const tp = f => { const r = row(f); return r ? `<b>${esc(r.name)}</b><br>Most Googled game: ${esc(r.game)}<br>${fmt(r.v)} average monthly searches` : `<b>${esc((f.properties || {}).name || '')}</b><br>No data`; };
  const cuts = [d3.min(rows, r => r.v), ...sc.quantiles(), d3.max(rows, r => r.v)];
  const legend = '<span>Average monthly searches:</span>' + SCALE.map((g, i) => `<span>${sw(g)}${fmt(Math.round(cuts[i]))} to ${fmt(Math.round(cuts[i + 1]))}</span>`).join('') + `<span><i class="sw sw-top"></i>Most searches</span>`;
  return {kind:'us', topId: top.fips, id: id2, row, fill: f => { const r = row(f); return r ? sc(r.v) : null; }, info, tip: tp, legend};
}
function mapBlock(head, sub, prompt, cfg){
  state._cfg = cfg;
  return `<div class="sechead" style="margin-top:0"><div><h2 class="headline">${head}</h2><p class="sub">${sub}</p></div></div>` + screenHtml(prompt, cfg.legend);
}
function topCard(title, note, items, color){
  return `<div class="card" style="margin-top:34px"><h3>${title}</h3><p class="note">${note}</p>${barList(items, color)}</div>`;
}
const TBLCARD = '<div class="card" id="tblcard" style="margin-top:34px"></div>';
function viewHtml(){
  const world = state.mode === 'world', games = state.cat === 'games';
  if (world && games) return mapBlock('Most Googled game in every country', 'Each country is colored by the game with the most Google searches there. Select a game in the key to highlight its countries.', 'Hover over a country to see its most Googled game', catMapCfg('world')) +
    topCard('Top 10 most Googled games', 'Average monthly searches worldwide. Name and spelling variants are combined.', D.games.slice(0, 10).map(g => ({rank:g.rank, name:g.name, val:g.total, text:fmt(g.total)})), '#17b86a') + TBLCARD + methodHtml('world-games');
  if (world) return mapBlock('Most Googled console in every country', 'Each country is colored by the console with the most Google searches there. Select a console in the key to highlight its countries.', 'Hover over a country to see its most Googled console', catMapCfg('world')) +
    topCard('Top 10 most Googled consoles', 'Average monthly searches worldwide. Name variants are combined.', D.consoles.slice(0, 10).map(c => ({rank:c.rank, name:c.name, val:c.total, text:fmt(c.total)})), '#3b82f6') + TBLCARD + methodHtml('consoles');
  if (games) return mapBlock('Most Googled game in every state', 'Roblox is the most Googled game in all 50 states, so states are shaded by their average monthly Roblox searches.', 'Hover over a state to see its search interest', usaVolumeCfg()) +
    topCard('Top 10 states by searches', 'Average monthly searches for Roblox, the most Googled game in every state.', D.states.slice().sort((a, b) => b.v - a.v).slice(0, 10).map((r, i) => ({rank:i + 1, name:r.name, val:r.v, text:fmt(r.v)})), '#17b86a') + TBLCARD + methodHtml('usa-games');
  return mapBlock('Most Googled console in every state', 'Each state is colored by the console with the most Google searches there. Select a console in the key to highlight its states.', 'Hover over a state to see its most Googled console', catMapCfg('us')) + TBLCARD + methodHtml('usa-consoles');
}

/* ---------- tables ---------- */
const TABLES = {
  games: {tab:'Games', plural:'games', rows:() => D.games, title:n => `All ${n} games`, sort:['rank', 1], cols:[
    {k:'rank', l:'Rank'}, {k:'name', l:'Game', tl:1}, {k:'terms', l:'Search terms combined', tl:1, sm:1}, {k:'total', l:'Avg monthly searches', b:1}]},
  consoles: {tab:'Consoles', plural:'consoles', rows:() => D.consoles, title:n => `All ${n} consoles`, sort:['rank', 1], cols:[
    {k:'rank', l:'Rank'}, {k:'name', l:'Console', tl:1}, {k:'terms', l:'Search terms combined', tl:1, sm:1}, {k:'total', l:'Avg monthly searches', b:1}]},
  countries: {tab:'Countries', plural:'countries', rows:() => D.countries.slice().sort((a, b) => b.v - a.v), title:n => `All ${n} countries`, sort:['v', -1], cols:[
    {k:'name', l:'Country', tl:1}, {k:'game', l:'Most Googled game', tl:1}, {k:'v', l:'Avg monthly searches', b:1}]},
  countriesCon: {tab:'Countries', plural:'countries', rows:() => D.countries, title:n => `All ${n} countries`, sort:['name', 1], cols:[
    {k:'name', l:'Country', tl:1}, {k:'console', l:'Most Googled console', tl:1}]},
  states: {tab:'States', plural:'states', rows:() => D.states.slice().sort((a, b) => b.v - a.v), title:n => `All ${n} states`, sort:['v', -1], cols:[
    {k:'name', l:'State', tl:1}, {k:'game', l:'Most Googled game', tl:1}, {k:'v', l:'Avg monthly searches', b:1}]},
  statesCon: {tab:'States', plural:'states', rows:() => D.states, title:n => `All ${n} states`, sort:['name', 1], cols:[
    {k:'name', l:'State', tl:1}, {k:'console', l:'Most Googled console', tl:1}]}
};
function cell(c, r){
  const v = r[c.k];
  if (c.k === 'terms') return esc(v.join(', '));
  if (c.k === 'game') return sw(CAT[v] || NODATA) + ' ' + esc(v);
  if (c.k === 'console') return sw(CCAT[v] || NODATA) + ' ' + esc(v);
  if (v == null) return '&ndash;';
  return typeof v === 'number' ? fmt(Math.round(v)) : esc(v);
}
function tableKeys(){
  const g = state.cat === 'games';
  if (state.mode === 'usa') return [g ? 'states' : 'statesCon'];
  return g ? ['games', 'countries'] : ['consoles', 'countriesCon'];
}
function mountTable(){
  const el = document.getElementById('tblcard'); if (!el) return;
  const keys = tableKeys(); if (!keys.includes(state.tbl)) { state.tbl = keys[0]; state.sort = {key:TABLES[keys[0]].sort[0], dir:TABLES[keys[0]].sort[1]}; }
  const T = TABLES[state.tbl], rows = T.rows();
  const seg = keys.length > 1 ? segHtml('tblSeg', 'Table', keys.map(k => [k, TABLES[k].tab]), state.tbl, 't') : '';
  el.innerHTML = `<div class="toolbar"><h3 style="margin:0">${T.title(rows.length)}</h3>${seg}
    <input type="search" id="q" placeholder="Search ${T.plural}" aria-label="Filter ${T.plural}" value="${esc(state.q)}"></div>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>`;
  document.getElementById('q').oninput = e => { state.q = e.target.value; fillTable(); };
  document.querySelectorAll('#tblSeg button').forEach(b => b.onclick = () => { state.tbl = b.dataset.t; state.sort = {key:TABLES[b.dataset.t].sort[0], dir:TABLES[b.dataset.t].sort[1]}; state.q = ''; mountTable(); });
  fillTable();
}
function fillTable(){
  const T = TABLES[state.tbl], rows = T.rows(), cols = T.cols;
  const cls = c => [c.tl ? 'tl' : '', c.sm ? 'hide-sm' : '', c.b ? 'per' : ''].filter(Boolean).join(' ');
  const th = document.querySelector('#tbl thead');
  th.innerHTML = '<tr>' + cols.map(c => `<th scope="col" class="${c.tl ? 'tl' : ''} ${c.sm ? 'hide-sm' : ''}" aria-sort="${state.sort.key === c.k ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-k="${c.k}">${c.l}${state.sort.key === c.k ? (state.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('') + '</tr>';
  th.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    state.sort = state.sort.key === k ? {key:k, dir:-state.sort.dir} : {key:k, dir:(['name', 'rank', 'game', 'console', 'terms'].includes(k)) ? 1 : -1};
    fillTable();
  });
  const q = state.q.trim().toLowerCase(), {key, dir} = state.sort;
  const val = r => key === 'terms' ? r.terms.join(', ') : r[key];
  const list = rows.filter(r => !q || (r.name + ' ' + (r.game || '') + ' ' + (r.console || '')).toLowerCase().includes(q)).slice().sort((x, y) => {
    const a = val(x), b = val(y);
    if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
    return (typeof a === 'string' ? a.localeCompare(b) : a - b) * dir;
  });
  document.querySelector('#tbl tbody').innerHTML = list.length
    ? list.map(r => '<tr>' + cols.map(c => `<td class="${cls(c)}">${cell(c, r)}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}" style="text-align:center;color:#53657b">No ${T.plural} match your search.</td></tr>`;
}

/* ---------- methodology ---------- */
function methodHtml(kind){
  const base = `<li>Search data comes from Google Keyword Planner and covers average monthly searches over the last 12 months. Keyword Planner reports volumes in rounded bands, so figures are approximate and some titles share the same number.</li>`;
  const games = `<li>The game list only includes games playable on consoles (no PC-only or mobile-only titles). Older editions are kept if they are still widely played.</li>
    <li>Name and spelling variants of the same game are added together. For example, GTA VI combines searches for ${D.games.find(g => g.name === 'GTA VI').terms.map(t => '&ldquo;' + t + '&rdquo;').join(', ')}. The full term list for every game is in the table.</li>`;
  const cons = `<li>Consoles are ranked by model. Search terms for the same console are added together (for example, &ldquo;ps5&rdquo; and &ldquo;playstation 5&rdquo;). The full term list for every console is in the table.</li>`;
  const nodata = `<li>Countries missing from the search data are shown as no data.</li>`;
  const items = {
    'world-games': base + games + nodata,
    'usa-games': base + games + `<li>The map shows the most Googled game in each state, with states shaded by that game’s average monthly searches. State totals are summed from state-level data and can differ slightly from the national figure.</li>`,
    'consoles': base + cons + `<li>The map shows the most Googled console in each country.</li>` + nodata,
    'usa-consoles': base + cons + `<li>The map shows the most Googled console in each state.</li>`
  };
  return `<section class="method"><h3>Methodology</h3><ul>${items[kind]}</ul></section>`;
}

/* ---------- page ---------- */
function render(){
  const T = {
    'world-games': ['World’s Most Googled Video Games in 2026', `This page tracks Google searches for <b>${D.games.length} console games</b>, based on <b>${D.gameTerms} search terms</b> with name and spelling variants combined. It shows the most Googled games worldwide and the most Googled game in each of <b>${D.countries.length} countries</b>.`, [[D.games.length, 'games'], [D.gameTerms, 'search terms'], [D.countries.length, 'countries']]],
    'world-consoles': ['World’s Most Googled Consoles in 2026', `This page tracks Google searches for <b>${D.consoles.length} consoles and gaming devices</b>, based on <b>${D.conTerms} search terms</b> with name variants combined. It shows the most Googled consoles worldwide and the most Googled console in each of <b>${D.countries.length} countries</b>.`, [[D.consoles.length, 'consoles'], [D.conTerms, 'search terms'], [D.countries.length, 'countries']]],
    'usa-games': ['America’s Most Googled Video Games, State by State', `This page shows the most Googled video game in each of the <b>${D.states.length} US states</b>, based on Google searches for the same <b>${D.gameTerms} search terms</b> across <b>${D.games.length} console games</b>.`, [[D.states.length, 'states'], [D.games.length, 'games'], [D.gameTerms, 'search terms']]],
    'usa-consoles': ['America’s Most Googled Consoles, State by State', `This page shows the most Googled console in each of the <b>${D.states.length} US states</b>, based on Google searches for <b>${D.conTerms} search terms</b> covering <b>${D.consoles.length} consoles and gaming devices</b>.`, [[D.states.length, 'states'], [D.consoles.length, 'consoles'], [D.conTerms, 'search terms']]]
  }[state.mode + '-' + state.cat];
  document.getElementById('title').textContent = T[0];
  document.title = T[0].replace(' in 2026', '') + ' | Action Network';
  document.getElementById('lede').innerHTML = T[1];
  document.getElementById('chips').innerHTML = T[2].map(([n, l]) => `<div class="chip"><b>${n}</b><span>${l}</span></div>`).join('');
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('#catSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
  document.getElementById('app').innerHTML = viewHtml();
  document.querySelectorAll('#legend .lg').forEach(b => b.onclick = () => {
    state.focus = state.focus === b.dataset.g ? null : b.dataset.g;
    document.querySelectorAll('#legend .lg').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.g === state.focus)));
    applyFocus();
  });
  mountTable();
  curPaths = null;
  drawMap(state._cfg);
  setHash();
}
function reset(){ state.focus = null; state.q = ''; state.tbl = ''; }
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; reset(); render(); });
document.querySelectorAll('#catSeg button').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; reset(); render(); });
if (location.hash === '#usa') state.mode = 'usa';
render();
})();

</script>
